<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <center>
    <h1>Registration Form</h1>
    <form action="submit.php" method="post">
        <label for="name">Name:</label> <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

        DATE OF BIRTH:
        <input type="date" id="dob" name="dob" placeholder="Enter your date of birth" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required><br><br>

        

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>  
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label><br><br>

        age:
        <input type="number" id="age" name="age" min="1" max="100" placeholder="Enter your age" required><br><br>    

        WRITE YOUR HOBIES:
        <input type="checkbox" id="reading" name="hobbies" value="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" id="writing" name="hobbies" value="writing">
        <label for="writing">Writing</label>
        <input type="checkbox" id="traveling" name="hobbies" value="traveling">
        <label for="traveling">Traveling</label><br><br>

        CHOOSE YOUR STREAM: 
        <input type="checkbox" id="science" name="stream" value="science">
        <label for="science">Science</label>
        <input type="checkbox" id="commerce" name="stream" value="commerce">
        <label for="commerce">Commerce</label>
        <input type="checkbox" id="humanities" name="stream" value="humanities">
        <label for="humanities">Humanities</label><br><br>

        PASSWORD:
                <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
    


        <input type="submit" value="Register">
        <input type="reset" value="Reset">
        
    </form>
    </center>

      </body>
</html>
